<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TGV INOUI — Simulateur</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; }
canvas { display:block; position:fixed; top:0; left:0; }

/* ── HUD ── */
#hud { position:fixed; inset:0; pointer-events:none; }

#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:14px 18px 30px;
  background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);
  display:flex; justify-content:space-between; align-items:flex-start;
}
#logo { font-family:'Courier New',monospace; font-size:18px; font-weight:bold;
        letter-spacing:5px; color:#fff; text-shadow:0 0 18px rgba(255,90,0,.9); }
#logo b { color:#ff4500; }
#distbox { text-align:right; line-height:1.3; }
#dist-val  { font-family:'Courier New',monospace; font-size:26px; font-weight:bold; color:#fff; }
#dist-unit { font-family:'Courier New',monospace; font-size:9px; color:#aaa; letter-spacing:2px; }

/* Station announce */
#announce {
  position:absolute; top:64px; left:50%; transform:translateX(-50%);
  white-space:nowrap; opacity:0; transition:opacity .4s;
  font-family:'Courier New',monospace; font-size:13px; letter-spacing:1px; color:#ffe066;
  background:rgba(0,0,0,.6); border:1px solid rgba(255,220,0,.25);
  padding:6px 18px; border-radius:4px; pointer-events:none;
}
#announce.show { opacity:1; }

/* View toggle */
#btn-view {
  position:absolute; top:62px; right:16px;
  font-family:'Courier New',monospace; font-size:10px; letter-spacing:2px;
  text-transform:uppercase; color:#ff8800;
  background:rgba(255,100,0,.15); border:1px solid rgba(255,100,0,.4);
  padding:7px 13px; border-radius:4px; cursor:pointer;
  pointer-events:all; -webkit-user-select:none; user-select:none;
}
#btn-view:active { background:rgba(255,100,0,.4); }

/* Speedometer */
#speedo-wrap {
  position:absolute; bottom:18px; right:14px;
  display:flex; flex-direction:column; align-items:center;
  filter:drop-shadow(0 0 10px rgba(255,70,0,.5));
}
#spd-lbl { font-family:'Courier New',monospace; font-size:9px; letter-spacing:3px; color:#ff6600; margin-top:3px; }

/* Desktop keyboard hint */
#kb-hint {
  position:absolute; bottom:18px; left:16px;
  font-family:'Courier New',monospace; font-size:11px;
  color:rgba(255,255,255,.4); line-height:2.1;
}
#kb-hint em { font-style:normal; color:rgba(255,140,0,.8); }
@media (pointer:coarse),(max-width:800px) { #kb-hint { display:none; } }

/* Speed vignette */
#vignette {
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.7) 100%);
  opacity:0; transition:opacity .3s;
}

/* ── MOBILE CONTROLS ── */
#mobile-ui {
  display:none;
  position:absolute; bottom:0; left:0; right:0; height:210px;
  pointer-events:none;
}
@media (pointer:coarse),(max-width:800px) { #mobile-ui { display:block; } }

#left-ctrl {
  position:absolute; left:0; bottom:0; width:46%; height:100%;
  display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; gap:12px; padding-bottom:24px;
  pointer-events:all;
}
.mbtn {
  width:110px; height:60px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:28px; border:2px solid rgba(255,255,255,.18);
  -webkit-user-select:none; user-select:none; transition:background .1s;
}
#mbtn-accel { background:rgba(0,200,80,.2); border-color:rgba(0,220,90,.45); }
#mbtn-accel.pressed { background:rgba(0,220,90,.5); }
#mbtn-brake { background:rgba(220,40,40,.2); border-color:rgba(255,60,60,.45); }
#mbtn-brake.pressed { background:rgba(255,60,60,.5); }

#right-ctrl {
  position:absolute; right:0; bottom:0; width:46%; height:100%;
  pointer-events:all;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:30px;
}
#cam-hint {
  font-family:'Courier New',monospace; font-size:10px; letter-spacing:1px;
  color:rgba(255,255,255,.3); text-align:center; line-height:1.8;
  pointer-events:none;
}

/* ── LOADING ── */
#loading {
  position:fixed; inset:0; z-index:100;
  background:#070707;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
}
.l-logo { font-family:'Courier New',monospace; font-size:28px; font-weight:bold;
          letter-spacing:8px; color:#fff; }
.l-logo b { color:#ff4500; }
.l-track { width:260px; height:3px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; }
.l-bar { height:100%; background:#ff4500; width:0; transition:width .3s; }
.l-txt { font-family:'Courier New',monospace; font-size:11px; color:#444; letter-spacing:3px; }
</style>
</head>
<body>

<div id="loading">
  <div class="l-logo">TGV <b>INOUI</b></div>
  <div class="l-track"><div class="l-bar" id="lbar"></div></div>
  <div class="l-txt" id="ltxt">CHARGEMENT…</div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <div id="topbar">
    <div id="logo">TGV <b>INOUI</b></div>
    <div id="distbox">
      <div id="dist-val">0.0</div>
      <div id="dist-unit">km parcourus</div>
    </div>
  </div>

  <div id="announce"></div>
  <button id="btn-view">Vue cabine</button>
  <div id="vignette"></div>

  <div id="kb-hint">
    <div><em>W / ↑</em>  Accélérer</div>
    <div><em>S / ↓</em>  Freiner</div>
    <div><em>Glisser</em>  Caméra</div>
    <div><em>V</em>  Vue</div>
  </div>

  <div id="speedo-wrap">
    <canvas id="sc" width="150" height="150"></canvas>
    <div id="spd-lbl">km/h</div>
  </div>

  <div id="mobile-ui">
    <div id="left-ctrl">
      <div class="mbtn" id="mbtn-accel">▲</div>
      <div class="mbtn" id="mbtn-brake">▼</div>
    </div>
    <div id="right-ctrl">
      <div id="cam-hint">Glisser<br>caméra</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
'use strict';

// ── LOADING PROGRESS ──
const lbar = document.getElementById('lbar');
const ltxt = document.getElementById('ltxt');
function setProgress(pct, msg) {
  lbar.style.width = pct + '%';
  if (msg) ltxt.textContent = msg;
}
function hideLoading() {
  const el = document.getElementById('loading');
  el.style.transition = 'opacity 0.6s';
  el.style.opacity = '0';
  setTimeout(() => { el.style.display = 'none'; }, 650);
}

// ── RENDERER ──
const isMobile = window.matchMedia('(pointer:coarse)').matches || window.innerWidth <= 800;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const DFOG = 0.0014;
scene.fog = new THREE.FogExp2(0x9ecfe8, DFOG);

const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 3000);
camera.position.set(0, 7, 30);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ── LIGHTING ──
const sun = new THREE.DirectionalLight(0xfff0d0, 1.8);
sun.position.set(300, 500, -100);
sun.castShadow = !isMobile;
if (!isMobile) {
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, {near:10, far:2000, left:-400, right:400, top:300, bottom:-300});
}
scene.add(sun);
scene.add(new THREE.AmbientLight(0x6699cc, 0.6));
scene.add(new THREE.HemisphereLight(0x9ecfe8, 0x5a8a3f, 0.45));

// ── SKY ──
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(2500, 16, 10),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: { top:{value:new THREE.Color(0x1a6eb5)}, bot:{value:new THREE.Color(0x9ecfe8)} },
    vertexShader: `varying vec3 p; void main(){ p=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 p; uniform vec3 top,bot;
      void main(){ gl_FragColor=vec4(mix(bot,top,clamp((p.y+100.)/700.,0.,1.)),1.); }`
  })
));

const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(60, 24),
  new THREE.MeshBasicMaterial({ color:0xfffae0, transparent:true, opacity:0.9 })
);
sunDisc.position.set(280, 480, -500);
scene.add(sunDisc);

// ── GROUND ──
const GROUND_SIZE = 5000;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 1, 1),
  new THREE.MeshLambertMaterial({ color:0x5a8a3f })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ── SHARED MATERIALS & GEOMETRIES ──
const M = {
  rail:    new THREE.MeshStandardMaterial({ color:0x999999, metalness:.95, roughness:.2 }),
  sleep:   new THREE.MeshLambertMaterial ({ color:0x5a4030 }),
  ballast: new THREE.MeshLambertMaterial ({ color:0x8a8070 }),
  pole:    new THREE.MeshStandardMaterial({ color:0xbbbbbb, metalness:.7, roughness:.4 }),
  wire:    new THREE.LineBasicMaterial   ({ color:0xdddddd }),
  leaf1:   new THREE.MeshLambertMaterial ({ color:0x2a6420 }),
  leaf2:   new THREE.MeshLambertMaterial ({ color:0x3a7a28 }),
  leaf3:   new THREE.MeshLambertMaterial ({ color:0x4a6030 }),
  trunk:   new THREE.MeshLambertMaterial ({ color:0x5a3c1c }),
  wall:    new THREE.MeshLambertMaterial ({ color:0xe0d4c0 }),
  roof:    new THREE.MeshLambertMaterial ({ color:0x884444 }),
  platf:   new THREE.MeshLambertMaterial ({ color:0xc8c8c8 }),
  platfEdge:new THREE.MeshLambertMaterial({ color:0xffdd00 }),
  concrete:new THREE.MeshLambertMaterial ({ color:0xaaaaaa }),
  glass:   new THREE.MeshLambertMaterial ({ color:0x88aabb, transparent:true, opacity:.55 }),
};

const SEG = 200;
const G = {
  rail:  new THREE.BoxGeometry(0.07, 0.12, SEG),
  sleep: new THREE.BoxGeometry(2.7, 0.22, 0.28),
  ball:  new THREE.BoxGeometry(4.4, 0.2, SEG),
  pole:  new THREE.CylinderGeometry(.05,.05,7,6),
  arm:   new THREE.CylinderGeometry(.03,.03,1.8,5),
};

// ── PROCEDURAL HELPERS ──
function rng(seed) {
  let s = seed;
  return ()=>{ s=(s*1664525+1013904223)&0xffffffff; return (s>>>0)/4294967295; };
}

function makeTree(x, z, h, v) {
  const g = new THREE.Group();
  const th = h*.42, tr = h*.042;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(tr*.5,tr,th,6), M.trunk);
  trunk.position.y = th/2; g.add(trunk);
  const lm = [M.leaf1, M.leaf2, M.leaf3][v%3];
  if (v===0) {
    [.42,.32,.22].forEach((r,i)=>{
      const c = new THREE.Mesh(new THREE.ConeGeometry(h*r, h*.48,7), lm);
      c.position.y = th + i*h*.19; g.add(c);
    });
  } else {
    const cr = new THREE.Mesh(new THREE.SphereGeometry(h*.31,7,6), lm);
    cr.position.y = th+h*.28; cr.scale.x=1+(.5-v*.1); cr.scale.z=.85; g.add(cr);
    const cr2 = new THREE.Mesh(new THREE.SphereGeometry(h*.2,6,5), lm);
    cr2.position.set(.4*h, th+h*.44, 0); g.add(cr2);
  }
  g.position.set(x,0,z); return g;
}

function makeHouse(x, z, r) {
  const g = new THREE.Group();
  const w=6+r*6, d=5+r*5;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,4+r*3,d), M.wall);
  b.position.y=(4+r*3)/2; g.add(b);
  const rf = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.75,2.5+r,4), M.roof);
  rf.position.y=4+r*3+1.2; rf.rotation.y=Math.PI/4; g.add(rf);
  g.position.set(x,0,z); return g;
}

// ── TRACK SEGMENT GENERATION ──
const segments = new Map();
const AHEAD=12, BEHIND=4;

function makeSegment(idx) {
  const g = new THREE.Group();
  const z0 = -idx*SEG - SEG/2;

  const ball = new THREE.Mesh(G.ball, M.ballast);
  ball.position.set(0, .1, z0); ball.receiveShadow=true; g.add(ball);

  for (const s of [-1,1]) {
    const r = new THREE.Mesh(G.rail, M.rail);
    r.position.set(s*.7175, .28, z0); g.add(r);
  }

  const nSleep = Math.floor(SEG/.65);
  for (let i=0; i<nSleep; i++) {
    const sl = new THREE.Mesh(G.sleep, M.sleep);
    sl.position.set(0, .17, -idx*SEG - i*.65 - .3);
    sl.receiveShadow=true; g.add(sl);
  }

  const np = Math.floor(SEG/55);
  for (let i=0; i<=np; i++) {
    const zp = -idx*SEG - i*55;
    for (const s of [-1,1]) {
      const pole = new THREE.Mesh(G.pole, M.pole);
      pole.position.set(s*3.4, 3.5, zp); pole.castShadow=!isMobile; g.add(pole);
      const arm = new THREE.Mesh(G.arm, M.pole);
      arm.rotation.z=Math.PI/2; arm.position.set(s*2.6, 7, zp); g.add(arm);
    }
    if (i<np) {
      const pts=[];
      for (let t=0;t<=8;t++) {
        const frac=t/8;
        const sag = Math.sin(frac*Math.PI)*0.18;
        pts.push(new THREE.Vector3(0, 7-sag, zp - frac*55));
      }
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), M.wire));
      for (let h=1;h<8;h++) {
        const zh = zp - h*(55/8);
        const sagH = Math.sin((h/8)*Math.PI)*0.18;
        const hg = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 7-sagH, zh),
            new THREE.Vector3(0, 7-sagH-0.5, zh)
          ]), M.wire
        );
        g.add(hg);
      }
    }
  }

  const rand = rng(idx * 7919);
  const nTrees = 18 + Math.floor(rand()*12);
  for (let i=0; i<nTrees; i++) {
    const side = rand()>.5?1:-1;
    const dist = 9 + rand()*50;
    const tz = -idx*SEG - rand()*SEG;
    const h = 5 + rand()*12;
    const t = makeTree(side*dist, tz, h, Math.floor(rand()*3));
    t.castShadow=!isMobile; g.add(t);
  }
  if (rand()>.6) {
    const s = rand()>.5?1:-1;
    const hz = -idx*SEG - rand()*SEG;
    g.add(makeHouse(s*(22+rand()*40), hz, rand()));
  }
  if (rand()>.4) {
    for (let i=0;i<3;i++) {
      const zp2 = -idx*SEG - rand()*SEG;
      const pl = new THREE.Mesh(new THREE.CylinderGeometry(.04,.06,10,5), M.pole);
      pl.position.set(rand()>.5?-60:-55, 5, zp2); g.add(pl);
    }
  }

  scene.add(g); segments.set(idx, g);
}

// ── STATIONS ──
const STATIONS = [
  { dist:0,   name:'Paris Gare de Lyon'    },
  { dist:4.5, name:'Melun'                 },
  { dist:35,  name:'Montereau'             },
  { dist:80,  name:'Sens'                  },
  { dist:130, name:'Auxerre'               },
  { dist:195, name:'Dijon'                 },
  { dist:290, name:'Chalon-sur-Saône'      },
  { dist:345, name:'Mâcon'                 },
  { dist:400, name:'Lyon Part-Dieu'        },
  { dist:480, name:'Valence TGV'           },
  { dist:580, name:'Avignon TGV'           },
  { dist:640, name:'Aix-en-Provence TGV'   },
  { dist:670, name:'Marseille Saint-Charles'},
];

function makeSignTexture(name) {
  const cv = document.createElement('canvas');
  cv.width=512; cv.height=128;
  const ctx = cv.getContext('2d');
  ctx.fillStyle='#00318a'; ctx.fillRect(0,0,512,128);
  ctx.strokeStyle='#c8a000'; ctx.lineWidth=4;
  ctx.strokeRect(4,4,504,120);
  ctx.fillStyle='#ffffff';
  const fs = name.length > 18 ? 36 : 46;
  ctx.font = `bold ${fs}px Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(name,256,68);
  return new THREE.CanvasTexture(cv);
}

function buildStation(name, worldZ) {
  const g = new THREE.Group();
  const PLEN = 420, PWID = 5.5, PHGT = 0.92;

  for (const side of [-1,1]) {
    const platX = side * (0.7175 + .5 + PWID/2 + .4);
    const plat = new THREE.Mesh(new THREE.BoxGeometry(PWID, PHGT, PLEN), M.platf);
    plat.position.set(platX, PHGT/2, worldZ);
    plat.receiveShadow=true; g.add(plat);

    const stripe = new THREE.Mesh(new THREE.BoxGeometry(.08, .025, PLEN), M.platfEdge);
    stripe.position.set(platX - side*(PWID/2-.08), PHGT+.012, worldZ);
    g.add(stripe);

    const tact = new THREE.Mesh(new THREE.BoxGeometry(.5, .025, PLEN),
      new THREE.MeshLambertMaterial({color:0xddbb00}));
    tact.position.set(platX - side*(PWID/2-.45), PHGT+.012, worldZ);
    g.add(tact);
  }

  const pillarH = 5.2, canopyW = 14;
  const NSPAN = Math.floor(PLEN / 14);
  for (let i=0; i<NSPAN; i++) {
    const cz = worldZ - PLEN/2 + (i+.5)*14;
    for (const side of [-1,1]) {
      const pillar = new THREE.Mesh(
        new THREE.BoxGeometry(.18, pillarH, .18),
        new THREE.MeshStandardMaterial({color:0x888888,metalness:.8,roughness:.3})
      );
      pillar.position.set(side*6.5, pillarH/2, cz);
      pillar.castShadow=!isMobile; g.add(pillar);
    }
    const panel = new THREE.Mesh(
      new THREE.BoxGeometry(canopyW, .12, 13.8),
      M.glass
    );
    panel.position.set(0, pillarH, cz);
    g.add(panel);
  }

  // Station building
  const bldg = new THREE.Mesh(new THREE.BoxGeometry(18,9,12), M.wall);
  bldg.position.set(12, 4.5, worldZ + PLEN/2 - 6);
  g.add(bldg);
  const bRoof = new THREE.Mesh(new THREE.BoxGeometry(18.4,1,12.4), M.concrete);
  bRoof.position.set(12, 9.5, worldZ + PLEN/2 - 6);
  g.add(bRoof);

  // Sign
  const signTex = makeSignTexture(name);
  const sign = new THREE.Mesh(
    new THREE.BoxGeometry(8, 1.2, .1),
    new THREE.MeshBasicMaterial({ map: signTex })
  );
  sign.position.set(0, PHGT + 2.2, worldZ + PLEN/2 - 2);
  g.add(sign);

  scene.add(g);
}

// Build all stations
STATIONS.forEach(st => {
  const worldZ = -(st.dist * 1000 / SEG) * SEG;
  buildStation(st.name, worldZ);
});

// ── TRAIN MESH (procedural TGV) ──
const trainGroup = new THREE.Group();

function makeTGV() {
  const bodyMat = new THREE.MeshStandardMaterial({ color:0xc8d8e8, metalness:.6, roughness:.3 });
  const noseMat = new THREE.MeshStandardMaterial({ color:0xd0e0f0, metalness:.5, roughness:.4 });
  const darkMat = new THREE.MeshLambertMaterial({ color:0x222233 });
  const redMat  = new THREE.MeshLambertMaterial({ color:0xcc2200 });
  const glassMat= new THREE.MeshLambertMaterial({ color:0x334455, transparent:true, opacity:.7 });

  // Locomotive nose
  const noseGeo = new THREE.CylinderGeometry(0.01, 1.5, 8, 8);
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.rotation.x = Math.PI/2;
  nose.position.set(0, 2.2, 4);
  trainGroup.add(nose);

  // Main body segments
  const carLen = 26;
  const nCars = 4;
  for (let c = 0; c < nCars; c++) {
    const zOff = -(c * carLen) - 4;
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.9, 3.4, carLen - .4), bodyMat);
    body.position.set(0, 2.2, zOff - carLen/2);
    body.castShadow = true;
    trainGroup.add(body);

    // Red stripe
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.92, .35, carLen - .4), redMat);
    stripe.position.set(0, 2.1, zOff - carLen/2);
    trainGroup.add(stripe);

    // Windows
    const nWin = 5;
    for (let w = 0; w < nWin; w++) {
      const wz = zOff - carLen/2 + 4 + w * 4.2;
      for (const sx of [-1,1]) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(.08, .9, 1.6), glassMat);
        win.position.set(sx*1.46, 2.7, wz);
        trainGroup.add(win);
      }
    }

    // Bogies
    for (const bz of [zOff - 6, zOff - carLen + 6]) {
      const bogie = new THREE.Mesh(new THREE.BoxGeometry(2.2, .5, 3.2), darkMat);
      bogie.position.set(0, .45, bz);
      trainGroup.add(bogie);
      for (const ax of [-1.1, 1.1]) {
        const axle = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.22,12), darkMat);
        axle.rotation.z = Math.PI/2;
        axle.position.set(0, .42, bz + ax);
        trainGroup.add(axle);
      }
    }
  }

  // Rear nose
  const rearNose = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 1.5, 8, 8), noseMat);
  rearNose.rotation.x = -Math.PI/2;
  rearNose.position.set(0, 2.2, -(nCars * carLen) - 0);
  trainGroup.add(rearNose);
}
makeTGV();
scene.add(trainGroup);

// ── TRAIN PHYSICS ──
let trainZ = 0;
let speed = 0;       // m/s
let distKm = 0;
const MAX_SPEED = 83.3; // 300 km/h in m/s
const ACCEL = 0.6;
const BRAKE = 1.4;
const DRAG  = 0.015;

const keys = { accel:false, brake:false };

// ── CAMERA MODES ──
// 0 = outside tracking, 1 = cab
let camMode = 0;
let camYaw = 0, camPitch = 0.12;
let camTargetYaw = 0, camTargetPitch = 0.12;

// ── STATION ANNOUNCE ──
const announceEl = document.getElementById('announce');
let announceTimer = null;
let lastAnnouncedIdx = -1;

function checkStations(km) {
  for (let i = 0; i < STATIONS.length; i++) {
    const st = STATIONS[i];
    if (i !== lastAnnouncedIdx && Math.abs(km - st.dist) < 0.5) {
      lastAnnouncedIdx = i;
      announceEl.textContent = '⬤ ' + st.name;
      announceEl.classList.add('show');
      clearTimeout(announceTimer);
      announceTimer = setTimeout(()=>announceEl.classList.remove('show'), 4000);
    }
  }
}

// ── SPEEDOMETER CANVAS ──
const sc = document.getElementById('sc');
const sctx = sc.getContext('2d');
const R = 72, CX = 75, CY = 75;

function drawSpeedo(kmh) {
  sctx.clearRect(0,0,150,150);
  // Background arc
  sctx.beginPath();
  sctx.arc(CX,CY,R,-2.4,0.8);
  sctx.strokeStyle='rgba(255,255,255,.08)';
  sctx.lineWidth=10; sctx.stroke();
  // Speed arc
  const pct = Math.min(kmh/320,1);
  const endAngle = -2.4 + pct*3.2;
  sctx.beginPath();
  sctx.arc(CX,CY,R,-2.4,endAngle);
  const grad = sctx.createLinearGradient(0,0,150,0);
  grad.addColorStop(0,'#ff4400'); grad.addColorStop(1,'#ffaa00');
  sctx.strokeStyle=grad; sctx.lineWidth=8; sctx.stroke();
  // Text
  sctx.fillStyle='#ffffff';
  sctx.font='bold 30px Courier New,monospace';
  sctx.textAlign='center'; sctx.textBaseline='middle';
  sctx.fillText(Math.round(kmh), CX, CY+2);
}

// ── HUD UPDATE ──
const distValEl = document.getElementById('dist-val');
const vignetteEl = document.getElementById('vignette');

// ── SEGMENT STREAMING ──
function updateSegments(segIdx) {
  for (let i = segIdx - BEHIND; i <= segIdx + AHEAD; i++) {
    if (i >= 0 && !segments.has(i)) makeSegment(i);
  }
  // Remove far-away segments
  for (const [k, g] of segments) {
    if (k < segIdx - BEHIND - 2 || k > segIdx + AHEAD + 2) {
      scene.remove(g);
      segments.delete(k);
    }
  }
}

// ── INPUT ──
document.addEventListener('keydown', e => {
  if (e.code==='KeyW'||e.code==='ArrowUp')   keys.accel=true;
  if (e.code==='KeyS'||e.code==='ArrowDown') keys.brake=true;
  if (e.code==='KeyV') toggleView();
});
document.addEventListener('keyup', e => {
  if (e.code==='KeyW'||e.code==='ArrowUp')   keys.accel=false;
  if (e.code==='KeyS'||e.code==='ArrowDown') keys.brake=false;
});

// Mobile buttons
const btnAccel = document.getElementById('mbtn-accel');
const btnBrake = document.getElementById('mbtn-brake');
btnAccel.addEventListener('pointerdown', ()=>{ keys.accel=true;  btnAccel.classList.add('pressed'); });
btnAccel.addEventListener('pointerup',   ()=>{ keys.accel=false; btnAccel.classList.remove('pressed'); });
btnBrake.addEventListener('pointerdown', ()=>{ keys.brake=true;  btnBrake.classList.add('pressed'); });
btnBrake.addEventListener('pointerup',   ()=>{ keys.brake=false; btnBrake.classList.remove('pressed'); });

// View button
document.getElementById('btn-view').addEventListener('click', toggleView);
function toggleView() {
  camMode = camMode === 0 ? 1 : 0;
  document.getElementById('btn-view').textContent = camMode===0 ? 'Vue cabine' : 'Vue extérieure';
}

// Camera drag
let dragActive = false, dragX=0, dragY=0;
function onDragStart(x,y) { dragActive=true; dragX=x; dragY=y; }
function onDragMove(x,y) {
  if (!dragActive) return;
  camTargetYaw   -= (x-dragX)*0.005;
  camTargetPitch -= (y-dragY)*0.003;
  camTargetPitch = Math.max(-0.05, Math.min(0.6, camTargetPitch));
  dragX=x; dragY=y;
}
function onDragEnd() { dragActive=false; }

canvas.addEventListener('mousedown', e=>onDragStart(e.clientX,e.clientY));
canvas.addEventListener('mousemove', e=>onDragMove(e.clientX,e.clientY));
canvas.addEventListener('mouseup',   onDragEnd);
canvas.addEventListener('mouseleave',onDragEnd);

const rightCtrl = document.getElementById('right-ctrl');
rightCtrl.addEventListener('touchstart', e=>{ const t=e.touches[0]; onDragStart(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
rightCtrl.addEventListener('touchmove',  e=>{ const t=e.touches[0]; onDragMove(t.clientX,t.clientY);  e.preventDefault(); },{passive:false});
rightCtrl.addEventListener('touchend',   onDragEnd);

// ── MAIN LOOP ──
let last = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  // Physics
  if (keys.accel) speed = Math.min(speed + ACCEL*dt, MAX_SPEED);
  if (keys.brake) speed = Math.max(speed - BRAKE*dt, 0);
  speed = Math.max(speed - DRAG*speed*dt, 0);

  trainZ -= speed * dt;
  distKm += speed * dt / 1000;

  // Ground follows train
  ground.position.z = trainZ;

  // Segment streaming
  const segIdx = Math.floor(-trainZ / SEG);
  updateSegments(segIdx);

  // HUD
  distValEl.textContent = distKm.toFixed(1);
  drawSpeedo(speed * 3.6);
  vignetteEl.style.opacity = (speed / MAX_SPEED * 0.8).toFixed(2);
  checkStations(distKm);

  // Camera
  camYaw   += (camTargetYaw   - camYaw)   * 0.08;
  camPitch += (camTargetPitch - camPitch) * 0.08;

  if (camMode === 0) {
    // Outside tracking camera
    const dist = 28, height = 8;
    const cx = Math.sin(camYaw) * dist;
    const cz = Math.cos(camYaw) * dist;
    camera.position.set(cx, height + camPitch*10, trainZ + cz);
    camera.lookAt(0, 2.5, trainZ - 5);
  } else {
    // Cab view
    camera.position.set(
      Math.sin(camYaw)*0.3,
      4.2,
      trainZ + 6 + Math.cos(camYaw)*0.3
    );
    const lookZ = trainZ - 80;
    camera.lookAt(Math.sin(camYaw)*20, 4.2 - camPitch*10, lookZ);
  }

  renderer.render(scene, camera);
}

// ── INIT ──
function init() {
  setProgress(30, 'GÉNÉRATION DU TERRAIN…');
  // Pre-build first segments
  for (let i = 0; i < 6; i++) makeSegment(i);
  setProgress(70, 'CONSTRUCTION DES VOIES…');
  setTimeout(()=>{
    setProgress(100, 'PRÊT');
    setTimeout(()=>{
      hideLoading();
      last = performance.now();
      requestAnimationFrame(animate);
    }, 400);
  }, 300);
}

init();
</script>
